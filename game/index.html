<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b1220" />
  <title>Penal Clash — Prototipo v2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- Canvas del juego -->
    <canvas id="stage"></canvas>

    <!-- Capa de HUD (marcador, mensajes, medidores) -->
    <div id="hud" class="layer">
      <div id="scoreboard" class="hidden">
        <div class="team team-red"><span class="dot"></span><span class="score" id="score-red">0</span></div>
        <div class="round-pill" id="round-pill">Ronda 1/3</div>
        <div class="team team-blue"><span class="score" id="score-blue">0</span><span class="dot"></span></div>
      </div>
      <div id="role-banner" class="hidden"></div>
      <div id="toast" class="hidden"></div>
      <div id="gesture-hint" class="hidden"></div>
    </div>

    <!-- Capa de menús (DOM) -->
    <div id="ui" class="layer"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
